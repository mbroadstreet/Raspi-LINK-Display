# 480x320 fullscreen landscape screen configuration, starting high contrast.
# Select at startup with --config; command-line options override file values.
# P cycles the inherited built-in presets. R reloads this same startup file.
# Unrelated omitted values inherit compiled defaults.
# General/role font paths have no active assignment: portable discovery.
# Global --font wins over role keys, then font_path, then discovery.
# Inactive examples name operator-provided literal CWD-relative files;
# no expansion/rebasing. Empty/space-tab-only supplied paths are invalid.
# R commits all four fonts or retains the whole Config/fonts/P selection.
# Bottom font is owned but has no visible text in the phase-only band.
# See docs/RUNTIME-CONFIG.md for portability, glyph and resource limits.
# status_font_path=assets/fonts/status.ttf
# tempo_font_path=assets/fonts/tempo.ttf
# bottom_font_path=assets/fonts/bottom.ttf
# help_font_path=assets/fonts/help.ttf

# Explicit screen-profile contract.
width=480
height=320
fullscreen=true
status_font_size=30
tempo_font_size=110
bottom_font_size=25
help_font_size=20
phase_bar_height=22
phase_bar_segment_gap=6
phase_bar_margin=24

# Explicit base palette matches compiled defaults; P to default restores it.
status_inactive_color=100,44,48,255
status_no_peers_color=40,54,88,255
status_connected_color=105,105,95,255
tempo_color=84,89,166,255
phase_bar_color=73,164,121,255
phase_marker_color=125,205,25,255

# Retain built-in list, labels, and high-contrast overrides; select it initially.
color_preset=high_contrast
