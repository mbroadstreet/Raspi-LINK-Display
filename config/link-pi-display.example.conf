# Raspi-LINK-Display example config (v0.6)
# Copy to config/link-pi-display.conf and edit.
#
# Sparse layering:
# - Commented or omitted keys inherit compiled defaults.
# - Uncommenting a key creates a file override.
# - --print-config displays the final effective values.
# - Command-line options override file values.
#
# P cycles color presets. R reloads this same startup file and
# reapplies the original CLI overrides. Invalid R is nonfatal.
# Window geometry changes still require restart; R does not restart
# Link or recreate the window.

# === File-only base palette (intentional active overrides) ===
# No-config startup keeps the dim compiled palette. Loading this file
# applies only these six colors unless more settings are activated.
status_inactive_color=100,44,48,255
status_no_peers_color=40,54,88,255
status_connected_color=105,105,95,255
tempo_color=84,89,166,255
phase_bar_color=73,164,121,255
phase_marker_color=125,205,25,255

# === Compiled default references (inactive until uncommented) ===
# Window / layout (restart to apply live geometry changes):
# width=480
# height=320
# fullscreen=true

# Font discovery remains portable unless font_path or --font is used:
# font_path=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
# status_font_size=30
# tempo_font_size=110
# bottom_font_size=25
# help_font_size=20

# Phase meter layout:
# phase_bar_height=22
# phase_bar_segment_gap=6
# phase_bar_margin=24

# Unchanged band and help colors:
# top_band_color=0,0,0,255
# center_band_color=18,18,18,255
# bottom_band_color=0,0,0,255
# help_overlay_background_color=0,0,0,220
# help_overlay_text_color=210,210,210,255

# Help overlay and fullscreen cursor:
# help_overlay_seconds=8
# hide_mouse_cursor=true

# === Built-in color presets (inactive examples) ===
# Omitting color_presets= retains built-ins: default,high_contrast.
# The built-in default is label-only and restores the file palette.
# The built-in high_contrast label and colors remain available to P.
# Choose the initial built-in preset by uncommenting:
# color_preset=high_contrast
# Override one built-in preset color by uncommenting, for example:
# color_preset.high_contrast.tempo_color=255,240,0,255
#
# An active color_presets= replaces the built-in list. Every listed ID
# then requires at least one color_preset.<id>.* definition in this file.
# Example replacement syntax:
# color_presets=default,high_contrast
# color_preset.default.name=Default
# color_preset.high_contrast.name=High Contrast
