# Raspi-LINK-Display example config (v0.6)
# Copy to config/link-pi-display.conf and edit.

# --- First-screen guide (Pi small terminal) ---
# Base / Default Colors below = normal appearance.
# high_contrast block later = alternate look for P.
# P = cycle color presets (wraps).
# R = reread the SAME config source chosen at startup
#     (--config PATH, or auto-discovered .conf, or
#     built-ins + original CLI only if no file).
# R reapplies original CLI overrides.
# Invalid R keeps working Config + fonts (nonfatal).
# width / height / fullscreen changes need RESTART.
# R does not restart Link or recreate the window.

# === Preset selection (P) ===
# File color_presets= replaces built-in list.
# Omit color_presets= to keep built-ins.
# color_presets= (empty) disables presets; P no-op.
color_presets=default,high_contrast
color_preset=default

# default is LABEL-ONLY: restores Base colors (no
# color_preset.default.*_color overrides needed).
color_preset.default.name=Default

# === Base / Default Colors (required layer) ===
# These top-level keys are the base effective colors.
# Partial presets inherit any color you omit here.
# Cycling to label-only default restores this base.
top_band_color=0,0,0,255
center_band_color=18,18,18,255
bottom_band_color=0,0,0,255
status_inactive_color=40,44,48,255
status_no_peers_color=40,44,48,255
status_connected_color=75,85,95,255
tempo_color=64,79,96,255
phase_bar_color=83,114,151,255
phase_marker_color=255,255,255,255
help_overlay_background_color=0,0,0,220
help_overlay_text_color=210,210,210,255

# === Window / Layout (restart to change live) ===
width=480
height=320
fullscreen=true

# === Font ===
# Comment font_path so discovery / CLI --font can apply.
# font_path=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
status_font_size=30
tempo_font_size=110
bottom_font_size=25
help_font_size=20

# === Phase meter layout ===
phase_bar_height=22
phase_bar_segment_gap=6
phase_bar_margin=24

# === Help overlay ===
help_overlay_seconds=8

# === Fullscreen cursor ===
hide_mouse_cursor=true

# === high_contrast overrides (alternate P look) ===
# Only listed colors override Base; others inherit Base.
color_preset.high_contrast.name=High Contrast
color_preset.high_contrast.status_inactive_color=220,220,220,255
color_preset.high_contrast.status_no_peers_color=220,220,220,255
color_preset.high_contrast.status_connected_color=255,255,255,255
color_preset.high_contrast.tempo_color=255,255,255,255
color_preset.high_contrast.phase_bar_color=255,255,255,255
color_preset.high_contrast.phase_marker_color=0,0,0,255
color_preset.high_contrast.top_band_color=0,0,0,255
color_preset.high_contrast.center_band_color=0,0,0,255
color_preset.high_contrast.bottom_band_color=0,0,0,255
color_preset.high_contrast.help_overlay_background_color=0,0,0,230
color_preset.high_contrast.help_overlay_text_color=255,255,255,255
