# Raspi-LINK-Display Configuration (v0.4)
# Copy this file to config/link-pi-display.conf and edit as needed.

# === Window / Layout ===
width=480
height=320
fullscreen=true

# === Font ===
# Use a commented example so the default discovered font is not overridden.
# font_path=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
status_font_size=30
tempo_font_size=110
bottom_font_size=25
help_font_size=20

# === Band / Background Colors (v0.4 explicit keys) ===
# Default v0.4 layout: black top/bottom, dark grey center (better readability on small TFTs)
top_band_color=0,0,0,255
center_band_color=18,18,18,255
bottom_band_color=0,0,0,255

# === Status Colors ===
status_inactive_color=40,44,48,255
status_no_peers_color=40,44,48,255
status_connected_color=75,85,95,255
tempo_color=64,79,96,255

# === Phase Meter ===
phase_bar_color=83,114,151,255
phase_marker_color=255,255,255,255
phase_bar_height=22
phase_bar_segment_gap=6
phase_bar_margin=24

# === Help Overlay ===
help_overlay_background_color=0,0,0,220
help_overlay_text_color=210,210,210,255
help_overlay_seconds=8

# === Fullscreen Behavior ===
hide_mouse_cursor=true
